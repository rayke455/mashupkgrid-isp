# Static NAS client list. Our `nas` table (packages/database/prisma/schema.prisma) carries extra
# multi-tenancy columns the stock `read_clients` SQL query doesn't select, so dynamic
# SQL-backed client loading is disabled (see mods-available/sql) and every router that will send
# Access-Request/Accounting-Request packets must be added here explicitly — mirroring the Router
# rows created via POST /api/v1/routers in the app. Add one `client` block per router:
#
# client main-mikrotik {
# 	ipaddr = 192.168.88.1
# 	secret = <the same PPP/RADIUS secret configured on the router itself>
# 	shortname = main-mikrotik
# }

client localhost {
	ipaddr = 127.0.0.1
	secret = testing123
}
