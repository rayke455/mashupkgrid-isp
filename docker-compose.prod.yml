# Production stack for mashuphost.tech on the Azure Ubuntu VM.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Differences from the dev docker-compose.yml, all deliberate:
#   * Postgres and Redis publish NO host ports. On a public VM the dev file's
#     "5432:5432" / "6379:6379" would expose them to the whole internet.
#   * api and web bind to 127.0.0.1 only -- Caddy is the sole public entrypoint.
#   * Credentials come from .env.production, never hardcoded here.
#   * A one-shot `migrate` service runs `prisma migrate deploy` before api/worker start.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env.production
    working_dir: /repo/packages/database
    command: ["npx", "prisma", "db", "push", "--skip-generate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    restart: unless-stopped
    env_file: .env.production
    # The embedded RADIUS server lives in the worker (apps/worker/src/index.ts) and must be
    # reachable by MikroTik NAS devices, so these two are public on purpose. Restrict the
    # sources in the Azure NSG to your routers' IPs.
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    volumes:
      # The paired WhatsApp (Baileys) session keys. Without a volume these live in the
      # container filesystem and are destroyed on every rebuild, forcing a fresh QR scan
      # after each deploy. Must match WHATSAPP_AUTH_STATE_PATH in .env.production.
      - whatsapp_auth:/data/whatsapp-auth
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        # Baked into the browser bundle at build time -- rebuild web if this ever changes.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env.production}
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  whatsapp_auth:
